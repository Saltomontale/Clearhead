<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gedanken-Cockpit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    padding: 16px;
    padding-bottom: 50px;
    max-width: 480px;
    margin: 0 auto;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 1px solid #2c2c2e;
  }
  .title { font-size: 20px; font-weight: 700; }
  .subtitle { font-size: 12px; color: #8e8e93; margin-top: 2px; }
  .ai-btn {
    background-color: #1c1c1e;
    color: #0a84ff;
    border: 1px solid #2c2c2e;
    padding: 6px 12px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .ai-btn.active {
    background-color: rgba(48, 209, 88, 0.15);
    color: #30d158;
    border-color: rgba(48, 209, 88, 0.3);
  }
  .card {
    background-color: #1c1c1e;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    border: 1px solid #2c2c2e;
  }
  .mic-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 14px;
    gap: 8px;
  }
  .mic-btn {
    width: 60px; height: 60px; border-radius: 50%;
    background-color: #0a84ff; border: none; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
    transition: transform 0.15s;
  }
  .mic-btn:active { transform: scale(0.94); }
  .mic-status {
    font-size: 12px;
    color: #8e8e93;
    text-align: center;
    line-height: 1.35;
  }
  textarea {
    width: 100%; background-color: #2c2c2e; color: #ffffff;
    border: 1px solid #3a3a3c; border-radius: 12px; padding: 12px;
    font-size: 16px; font-family: inherit; resize: none; outline: none; margin-bottom: 12px;
  }
  textarea:focus { border-color: #0a84ff; }
  .btn-primary {
    width: 100%; background-color: #0a84ff; color: #ffffff; border: none;
    border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:active { opacity: 0.8; }
  .btn-primary:disabled { opacity: 0.5; }
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; margin-top: 20px; padding: 0 4px;
  }
  .section-title { font-size: 13px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge { background: rgba(10, 132, 255, 0.2); color: #0a84ff; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .item-card { background-color: #1c1c1e; border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px solid #2c2c2e; }
  .event-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .event-title { font-size: 15px; font-weight: 600; }
  .event-time { font-size: 13px; color: #0a84ff; margin-top: 4px; }
  .btn-cal {
    width: 100%; background-color: #2c2c2e; color: #0a84ff;
    border: 1px solid rgba(10, 132, 255, 0.35); padding: 10px; border-radius: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .todo-row { display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.25s ease; }
  .todo-row.done { opacity: 0.4; filter: blur(0.6px); }
  .checkbox {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #636366;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #000; flex-shrink: 0;
  }
  .checkbox.done { background-color: #30d158; border-color: #30d158; color: #fff; }
  .todo-text { font-size: 15px; flex: 1; }
  .todo-text.done { text-decoration: line-through; color: #8e8e93; }
  .empty { text-align: center; color: #636366; font-size: 13px; padding: 14px; }
  .del-btn { background: none; border: none; color: #636366; font-size: 16px; padding: 0 4px; cursor: pointer; }
  .clear-btn { background: none; border: none; color: #8e8e93; font-size: 11px; cursor: pointer; }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal.open { display: flex; }
  .modal-box { background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 16px; padding: 18px; width: 100%; max-width: 360px; }
  .modal-box h3 { font-size: 16px; margin-bottom: 8px; }
  .modal-box p { font-size: 12px; color: #8e8e93; line-height: 1.4; margin-bottom: 12px; }
  .modal-box a { color: #0a84ff; text-decoration: none; }
  .modal-box input {
    width: 100%; background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff;
    padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; outline: none;
  }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

  <div class="header">
    <div>
      <div class="title">🧠 Gedanken-Cockpit</div>
      <div class="subtitle" id="dateDisplay"></div>
    </div>
    <button id="aiStatusBtn" class="ai-btn" onclick="openModal()">✨ KI</button>
  </div>

  <div class="card">
    <div class="mic-container">
      <button id="micBtn" class="mic-btn" onclick="focusDictation()">🎙️</button>
      <span id="micStatus" class="mic-status">Tippen &rarr; unten rechts auf der Tastatur diktieren</span>
    </div>

    <textarea id="thoughtInput" rows="3" placeholder="Tippe hier oder auf das Mikrofon und diktiere über deine iPhone-Tastatur..."></textarea>

    <button id="sortBtn" class="btn-primary" onclick="processThoughts()">✨ Gedanken sortieren</button>
  </div>

  <div class="section-header">
    <span class="section-title">📅 Kalender-Termine</span>
    <span class="badge" id="eventCount">0</span>
  </div>
  <div id="eventsList"></div>

  <div class="section-header">
    <span class="section-title">💼 To-Dos Arbeit</span>
    <button class="clear-btn" onclick="clearDone('work')">Erledigte löschen</button>
  </div>
  <div id="workTodosList"></div>

  <div class="section-header">
    <span class="section-title">🏠 To-Dos Privat</span>
    <button class="clear-btn" onclick="clearDone('private')">Erledigte löschen</button>
  </div>
  <div id="privateTodosList"></div>

  <div id="apiModal" class="modal">
    <div class="modal-box">
      <h3>✨ Google Gemini KI</h3>
      <p>Für KI-Stichpunkte kannst du auf <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> kostenlos einen Schlüssel erstellen und hier einfügen:</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
      <div class="modal-actions">
        <button style="background:#0a84ff; color:#fff;" onclick="saveApiKey()">Speichern</button>
        <button style="background:#2c2c2e; color:#fff;" onclick="closeModal()">Schließen</button>
      </div>
    </div>
  </div>

<script>
  let state = { events: [], todos: [] };
  try {
    const saved = localStorage.getItem('cockpit_state_v7');
    if (saved) state = JSON.parse(saved);
  } catch (e) {}

  function saveState() {
    try { localStorage.setItem('cockpit_state_v7', JSON.stringify(state)); } catch (e) {}
    render();
  }

  document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('de-DE', {
    weekday: 'long', day: 'numeric', month: 'long'
  });

  function updateAiBadge() {
    const key = (localStorage.getItem('gemini_api_key') || '').trim();
    const btn = document.getElementById('aiStatusBtn');
    if (key) {
      btn.innerText = '✨ KI aktiv';
      btn.classList.add('active');
    } else {
      btn.innerText = '✨ KI';
      btn.classList.remove('active');
    }
  }
  updateAiBadge();

  function openModal() {
    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    document.getElementById('apiModal').classList.add('open');
  }
  function closeModal() {
    document.getElementById('apiModal').classList.remove('open');
  }
  function saveApiKey() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (val) localStorage.setItem('gemini_api_key', val);
    else localStorage.removeItem('gemini_api_key');
    updateAiBadge();
    closeModal();
  }

  function focusDictation() {
    const input = document.getElementById('thoughtInput');
    const status = document.getElementById('micStatus');
    input.focus();
    status.innerText = "👇 Jetzt unten rechts auf das iPhone-Mikrofon tippen";
  }

  function extractTextFromResponse(data) {
    if (!data) return "";
    if (typeof data.output === "string") return data.output;
    if (Array.isArray(data.outputs)) {
      for (let i = data.outputs.length - 1; i >= 0; i--) {
        const out = data.outputs[i];
        if (typeof out.text === "string") return out.text;
        if (out.content) {
          if (typeof out.content === "string") return out.content;
          if (Array.isArray(out.content.parts)) {
            const txt = out.content.parts.map(function(p) { return p.text || ""; }).join("");
            if (txt) return txt;
          }
        }
      }
    }
    if (data.candidates && data.candidates[0] && data.candidates[0].content && Array.isArray(data.candidates[0].content.parts)) {
      return data.candidates[0].content.parts.map(function(p) { return p.text || ""; }).join("");
    }
    return "";
  }

  async function callGeminiTextAPI(apiKey, promptText) {
    const controller = new AbortController();
    const timer = setTimeout(function() { controller.abort(); }, 10000);

    try {
      const res = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions?key=' + encodeURIComponent(apiKey), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: "gemini-3.8-flash",
          input: promptText,
          response_format: {
            type: "json_schema",
            schema: {
              type: "object",
              properties: {
                events: {
                  type: "array",
                  items: {
                    type: "object",
                    properties: {
                      title: { type: "string" },
                      date: { type: "string" },
                      time: { type: "string" }
                    },
                    required: ["title", "date", "time"]
                  }
                },
                todos: {
                  type: "array",
                  items: {
                    type: "object",
                    properties: {
                      title: { type: "string" },
                      category: { type: "string" }
                    },
                    required: ["title", "category"]
                  }
                }
              },
              required: ["events", "todos"]
            }
          }
        }),
        signal: controller.signal
      });
      clearTimeout(timer);

      const data = await res.json().catch(function() { return {}; });
      if (res.ok) {
        const textOut = extractTextFromResponse(data);
        if (textOut !== "") return textOut;
        throw new Error("Leere Antwort von Gemini");
      }

      const errMsg = (data.error && data.error.message) ? data.error.message : ("HTTP " + res.status);
      if (res.status === 400 && errMsg.toLowerCase().includes('api key')) {
        throw new Error("API-Key ungültig – bitte unter '✨ KI' prüfen");
      }
      throw new Error(errMsg);
    } catch (err) {
      clearTimeout(timer);
      if (err.name === 'AbortError') {
        throw new Error("Zeitüberschreitung (10s)");
      }
      throw err;
    }
  }

  async function processThoughts() {
    const input = document.getElementById('thoughtInput');
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById('sortBtn');
    const status = document.getElementById('micStatus');
    btn.innerText = "⏳ KI fasst zusammen...";
    btn.disabled = true;

    const apiKey = (localStorage.getItem('gemini_api_key') || '').trim();

    try {
      if (apiKey) {
        await summarizeWithGemini(text, apiKey);
        status.innerText = "✅ Mit Gemini 3.8 Flash sortiert";
      } else {
        summarizeLocally(text);
        status.innerText = "Tippen → unten rechts auf der Tastatur diktieren";
      }
      input.value = '';
      saveState();
    } catch (e) {
      summarizeLocally(text);
      input.value = '';
      status.innerText = "⚠️ KI-Fehler (" + (e.message || "Unbekannt") + ") – lokal sortiert";
      saveState();
    } finally {
      btn.innerText = "✨ Gedanken sortieren";
      btn.disabled = false;
    }
  }

  async function summarizeWithGemini(text, apiKey) {
    const todayISO = new Date().toISOString().split('T')[0];
    const weekday = new Date().toLocaleDateString('de-DE', { weekday: 'long' });
    const prompt = "Heute ist " + weekday + ", der " + todayISO + ".\n" +
      "Analysiere diese Notiz: \"" + text + "\".\n" +
      "Extrahiere alle Termine und Aufgaben und fasse jeden Punkt extrem knapp als präzisen Stichpunkt (2 bis 4 Wörter, Infinitiv oder Nomen, KEINE Füllwörter, keine ganzen Sätze) zusammen! " +
      "Setze category bei beruflichen Aufgaben auf 'work', sonst auf 'private'.";

    const rawResponse = await callGeminiTextAPI(apiKey, prompt);
    const cleanJson = rawResponse.replace(/^```json\s*/i, '').replace(/```\s*$/, '').trim();
    const parsed = JSON.parse(cleanJson);

    (parsed.events || []).forEach(function(ev) {
      state.events.unshift({ id: Date.now() + Math.random(), title: ev.title, date: ev.date || todayISO, time: ev.time || "09:00" });
    });
    (parsed.todos || []).forEach(function(td) {
      state.todos.unshift({ id: Date.now() + Math.random(), title: td.title, done: false, category: td.category === 'work' ? 'work' : 'private' });
    });
  }

  // Lokaler Fallback-Parser
  const STOP_WORDS = new Set([
    'ich', 'du', 'er', 'sie', 'es', 'wir', 'ihr', 'mir', 'mich', 'uns', 'dir', 'dich',
    'muss', 'müsste', 'muß', 'sollte', 'soll', 'will', 'möchte', 'wollte', 'kann', 'könnte', 'darf',
    'habe', 'hab', 'haben', 'hatte', 'bin', 'sind', 'war', 'wäre', 'werde', 'würde',
    'eigentlich', 'unbedingt', 'wirklich', 'echt', 'mal', 'noch', 'nochmal', 'kurz', 'schnell',
    'bitte', 'dringend', 'heute', 'morgen', 'übermorgen', 'nachher', 'später', 'gleich',
    'irgendwann', 'vielleicht', 'auch', 'schon', 'wieder', 'eben', 'halt', 'ja', 'äh', 'ähm',
    'also', 'übrigens', 'außerdem', 'dann', 'danach', 'vorher', 'endlich', 'zeitnah',
    'mein', 'meine', 'meinen', 'meinem', 'meiner', 'dein', 'deine', 'sein', 'seine', 'unser', 'unsere',
    'der', 'die', 'das', 'den', 'dem', 'des', 'ein', 'eine', 'einen', 'einem', 'einer'
  ]);

  const VERB_TO_INF = {
    'rufe': 'rufen', 'anrufe': 'anrufen', 'kaufe': 'kaufen', 'einkaufe': 'einkaufen',
    'schreibe': 'schreiben', 'schicke': 'schicken', 'abschicke': 'abschicken',
    'sende': 'senden', 'maile': 'mailen', 'überweise': 'überweisen', 'bezahle': 'bezahlen',
    'zahle': 'zahlen', 'buche': 'buchen', 'hole': 'holen', 'abhole': 'abholen',
    'bringe': 'bringen', 'wegbringe': 'wegbringen', 'mache': 'machen', 'fertigmache': 'fertigmachen',
    'putze': 'putzen', 'wasche': 'waschen', 'räume': 'räumen', 'aufräume': 'aufräumen',
    'erledige': 'erledigen', 'kläre': 'klären', 'frage': 'fragen', 'bestelle': 'bestellen',
    'kündige': 'kündigen', 'plane': 'planen', 'nehme': 'nehmen', 'mitnehme': 'mitnehmen',
    'sage': 'sagen', 'absage': 'absagen', 'bereite': 'bereiten', 'vorbereite': 'vorbereiten',
    'melde': 'melden', 'anmelde': 'anmelden', 'fülle': 'füllen', 'ausfülle': 'ausfüllen',
    'werfe': 'werfen', 'wegwerfe': 'wegwerfen', 'treffe': 'treffen', 'besuche': 'besuchen',
    'repariere': 'reparieren', 'suche': 'suchen', 'checke': 'checken', 'prüfe': 'prüfen',
    'vereinbare': 'vereinbaren', 'lese': 'lesen', 'packe': 'packen', 'sortiere': 'sortieren'
  };

  const SEPARABLE_PREFIXES = new Set([
    'an', 'ein', 'auf', 'ab', 'weg', 'vor', 'aus', 'mit', 'zu', 'raus', 'hin', 'her',
    'fertig', 'sauber', 'weiter', 'zurück', 'vorbei', 'nach', 'durch', 'um'
  ]);

  function condenseToBulletPoint(rawText, isEvent) {
    let s = rawText.trim();
    s = s.replace(/^.*?(?:daran\s+denken|nicht\s+vergessen|vorgenommen|überlegt|wichtig)\s*(?:,\s*)?(?:dass\s+)?/i, '');
    s = s.replace(/^.*?(?:dass\s+ich|dass\s+wir|damit\s+ich|weil\s+ich)\s+/i, '');
    s = s.replace(/auf\s+jeden\s+fall|auf\s+dem\s+heimweg|in\s+der\s+stadt/gi, '');

    let rawWords = s.split(/\s+/).map(function(w) { return w.replace(/^[,.!?;:]+|[,.!?;:]+$/g, ''); }).filter(Boolean);
    let filtered = [];
    let movedVerbInf = null;

    for (let i = 0; i < rawWords.length; i++) {
      let w = rawWords[i];
      let lower = w.toLowerCase();
      if (STOP_WORDS.has(lower)) continue;

      if (!isEvent && VERB_TO_INF[lower]) {
        if (i === rawWords.length - 1) {
          filtered.push(VERB_TO_INF[lower]);
        } else {
          movedVerbInf = VERB_TO_INF[lower];
        }
        continue;
      }
      filtered.push(w);
    }

    if (!isEvent && movedVerbInf && filtered.length > 0) {
      let lastWordLower = filtered[filtered.length - 1].toLowerCase();
      if (SEPARABLE_PREFIXES.has(lastWordLower) && !movedVerbInf.startsWith(lastWordLower)) {
        filtered.pop();
        filtered.push(lastWordLower + movedVerbInf);
      } else {
        filtered.push(movedVerbInf);
      }
    }

    if (isEvent) {
      filtered = filtered.filter(function(w) { return !/^(gehen|fahren|kommen|machen|haben|wahrnehmen|besuchen|termin|wichtigen|wichtiger)$/i.test(w); });
      if (filtered.length > 1 && /^(zum|zur|beim|bei|in|ins|am)$/i.test(filtered[0])) {
        filtered.shift();
      }
    } else {
      if (filtered.length >= 2 && /^gehen$/i.test(filtered[filtered.length - 1])) {
        filtered.pop();
      }
      if (filtered.length > 2 && /^(an|für|mit|bei|zu|zum|zur)$/i.test(filtered[0])) {
        filtered.shift();
      }
    }

    let result = filtered.join(' ').trim();
    if (!result) return rawText.trim();
    return result.charAt(0).toUpperCase() + result.slice(1);
  }

  function summarizeLocally(text) {
    const parts = text.split(/\s+(?:und\s+danach|und\s+vorher|und\s+außerdem|außerdem|sowie|und\s+dann\s+noch|und\s+noch|ach\s*ja\s+und|und)\s+|[,.;]+\s*/i);

    parts.forEach(function(part) {
      let clean = part.trim();
      if (!clean) return;

      const timeMatch = clean.match(/(\d{1,2})(?:[:.](\d{2}))?\s*Uhr/i);
      const isTomorrow = /(?:^|\s)morgen(?=\s|$|[,.!?])/i.test(clean);
      const isDayAfter = /(?:^|\s)übermorgen(?=\s|$|[,.!?])/i.test(clean);
      const weekdayMatch = clean.match(/(?:am\s+)?(Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag)/i);
      const hasEventKeyword = /(termin|meeting|call|zahnarzt|arzt|friseur|treffen|essen|abendessen|mittagessen|frühstück|geburtstag|feier|kino|training|sport|konferenz|werkstatt|flug)/i.test(clean);

      if (timeMatch || ((isTomorrow || isDayAfter || weekdayMatch) && hasEventKeyword)) {
        let d = new Date();
        if (isTomorrow) d.setDate(d.getDate() + 1);
        else if (isDayAfter) d.setDate(d.getDate() + 2);
        else if (weekdayMatch) {
          const days = ['sonntag','montag','dienstag','mittwoch','donnerstag','freitag','samstag'];
          const target = days.indexOf(weekdayMatch[1].toLowerCase());
          let diff = (target - d.getDay() + 7) % 7;
          if (diff === 0) diff = 7;
          d.setDate(d.getDate() + diff);
        }

        let hours = timeMatch ? parseInt(timeMatch[1], 10) : 9;
        let mins = (timeMatch && timeMatch[2]) ? parseInt(timeMatch[2], 10) : 0;

        const dateStr = d.toISOString().split('T')[0];
        const timeStr = String(hours).padStart(2, '0') + ':' + String(mins).padStart(2, '0');

        let rawTitle = clean
          .replace(/(?:^|\s)(heute|morgen|übermorgen)(?=\s|$)/gi, ' ')
          .replace(/(?:am\s+)?(Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag)/gi, ' ')
          .replace(/(?:um\s+)?\d{1,2}(?:[:.]\d{2})?\s*Uhr/gi, ' ')
          .trim();

        let title = condenseToBulletPoint(rawTitle, true);
        if (!title) title = "Termin";

        state.events.unshift({ id: Date.now() + Math.random(), title: title, date: dateStr, time: timeStr });
      } else {
        let category = 'private';
        const workKeywords = ['arbeit', 'chef', 'chefin', 'meeting', 'kunde', 'kunden', 'projekt', 'büro', 'kollege', 'kollegin', 'rechnung', 'steuer', 'präsentation', 'mail', 'email', 'angebot', 'call', 'bericht', 'bewerbung', 'auftrag'];
        if (workKeywords.some(function(kw) { return clean.toLowerCase().includes(kw); })) {
          category = 'work';
        }

        let cleanedForPoint = clean.replace(/für\s+die\s+arbeit|auf\s+der\s+arbeit|\bprivat\b/gi, '');
        let todoTitle = condenseToBulletPoint(cleanedForPoint, false);

        if (todoTitle) {
          state.todos.unshift({ id: Date.now() + Math.random(), title: todoTitle, done: false, category: category });
        }
      }
    });
  }

  function exportICS(id) {
    const ev = state.events.find(function(e) { return e.id === id; });
    if (!ev) return;
    const partsDate = ev.date.split('-').map(Number);
    const partsTime = ev.time.split(':').map(Number);
    const start = new Date(partsDate[0], partsDate[1] - 1, partsDate[2], partsTime[0], partsTime[1]);
    const end = new Date(start.getTime() + 3600000);

    function fmt(dt) {
      return dt.getFullYear() +
        String(dt.getMonth() + 1).padStart(2, '0') +
        String(dt.getDate()).padStart(2, '0') + 'T' +
        String(dt.getHours()).padStart(2, '0') +
        String(dt.getMinutes()).padStart(2, '0') + '00';
    }

    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//GedankenCockpit//DE',
      'BEGIN:VEVENT',
      'UID:' + Date.now() + '@cockpit',
      'DTSTAMP:' + fmt(new Date()),
      'DTSTART:' + fmt(start),
      'DTEND:' + fmt(end),
      'SUMMARY:' + ev.title,
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');

    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = ev.title.replace(/\s+/g, '_') + '.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  }

  function toggleTodo(id) {
    const t = state.todos.find(function(x) { return x.id === id; });
    if (t) t.done = !t.done;
    saveState();
  }

  function deleteEvent(id) {
    state.events = state.events.filter(function(e) { return e.id !== id; });
    saveState();
  }

  function clearDone(category) {
    state.todos = state.todos.filter(function(t) { return !(t.category === category && t.done); });
    saveState();
  }

  function render() {
    document.getElementById('eventCount').innerText = state.events.length;
    
    const evEl = document.getElementById('eventsList');
    if (state.events.length === 0) {
      evEl.innerHTML = '<div class="item-card empty">Keine Termine vorhanden.</div>';
    } else {
      evEl.innerHTML = state.events.map(function(ev) {
        return '<div class="item-card">' +
          '<div class="event-top">' +
            '<div>' +
              '<div class="event-title">' + ev.title + '</div>' +
              '<div class="event-time">🗓️ ' + ev.date + ' &bull; ⏰ ' + ev.time + ' Uhr</div>' +
            '</div>' +
            '<button class="del-btn" onclick="deleteEvent(' + ev.id + ')">✕</button>' +
          '</div>' +
          '<button class="btn-cal" onclick="exportICS(' + ev.id + ')">📅 In Apple Kalender eintragen</button>' +
        '</div>';
      }).join('');
    }

    const sortedTodos = state.todos.slice().sort(function(a, b) {
      return (a.done === b.done) ? 0 : (a.done ? 1 : -1);
    });

    const workTodos = sortedTodos.filter(function(t) { return t.category === 'work'; });
    const workEl = document.getElementById('workTodosList');
    if (workTodos.length === 0) {
      workEl.innerHTML = '<div class="item-card empty">Keine Aufgaben im Bereich Arbeit.</div>';
    } else {
      workEl.innerHTML = workTodos.map(function(t) {
        return '<div class="item-card todo-row ' + (t.done ? 'done' : '') + '" onclick="toggleTodo(' + t.id + ')">' +
          '<div class="checkbox ' + (t.done ? 'done' : '') + '">' + (t.done ? '✓' : '') + '</div>' +
          '<div class="todo-text ' + (t.done ? 'done' : '') + '">' + t.title + '</div>' +
        '</div>';
      }).join('');
    }

    const privateTodos = sortedTodos.filter(function(t) { return t.category === 'private'; });
    const privEl = document.getElementById('privateTodosList');
    if (privateTodos.length === 0) {
      privEl.innerHTML = '<div class="item-card empty">Keine Aufgaben im Bereich Privat.</div>';
    } else {
      privEl.innerHTML = privateTodos.map(function(t) {
        return '<div class="item-card todo-row ' + (t.done ? 'done' : '') + '" onclick="toggleTodo(' + t.id + ')">' +
          '<div class="checkbox ' + (t.done ? 'done' : '') + '">' + (t.done ? '✓' : '') + '</div>' +
          '<div class="todo-text ' + (t.done ? 'done' : '') + '">' + t.title + '</div>' +
        '</div>';
      }).join('');
    }
  }

  render();
</script>
</body>
</html>
