<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gedanken-Cockpit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    padding: 16px;
    padding-bottom: 50px;
    max-width: 480px;
    margin: 0 auto;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 1px solid #2c2c2e;
  }
  .title { font-size: 20px; font-weight: 700; }
  .subtitle { font-size: 12px; color: #8e8e93; margin-top: 2px; }
  .ai-btn {
    background-color: #1c1c1e;
    color: #0a84ff;
    border: 1px solid #2c2c2e;
    padding: 6px 12px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .ai-btn.active {
    background-color: rgba(48, 209, 88, 0.15);
    color: #30d158;
    border-color: rgba(48, 209, 88, 0.3);
  }
  .card {
    background-color: #1c1c1e;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    border: 1px solid #2c2c2e;
  }
  .mic-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 14px;
    gap: 8px;
  }
  .mic-btn {
    width: 68px; height: 68px; border-radius: 50%;
    background-color: #0a84ff; border: none; font-size: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 4px 14px rgba(10, 132, 255, 0.35);
    transition: all 0.2s;
  }
  .mic-btn.recording {
    background-color: #ff3b30;
    animation: pulse 1.4s infinite;
  }
  .mic-status {
    font-size: 12px;
    color: #8e8e93;
    text-align: center;
    line-height: 1.35;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
    70% { box-shadow: 0 0 0 16px rgba(255, 59, 48, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
  }
  textarea {
    width: 100%; background-color: #2c2c2e; color: #ffffff;
    border: 1px solid #3a3a3c; border-radius: 12px; padding: 12px;
    font-size: 16px; font-family: inherit; resize: none; outline: none; margin-bottom: 12px;
  }
  textarea:focus { border-color: #0a84ff; }
  .btn-primary {
    width: 100%; background-color: #0a84ff; color: #ffffff; border: none;
    border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:active { opacity: 0.8; }
  .btn-primary:disabled { opacity: 0.5; }
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; margin-top: 20px; padding: 0 4px;
  }
  .section-title { font-size: 13px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge { background: rgba(10, 132, 255, 0.2); color: #0a84ff; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .item-card { background-color: #1c1c1e; border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px solid #2c2c2e; }
  .event-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .event-title { font-size: 15px; font-weight: 600; }
  .event-time { font-size: 13px; color: #0a84ff; margin-top: 4px; }
  .btn-cal {
    width: 100%; background-color: #2c2c2e; color: #0a84ff;
    border: 1px solid rgba(10, 132, 255, 0.35); padding: 10px; border-radius: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .todo-row { display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.25s ease; }
  .todo-row.done { opacity: 0.4; filter: blur(0.6px); }
  .checkbox {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #636366;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #000; flex-shrink: 0;
  }
  .checkbox.done { background-color: #30d158; border-color: #30d158; color: #fff; }
  .todo-text { font-size: 15px; flex: 1; }
  .todo-text.done { text-decoration: line-through; color: #8e8e93; }
  .empty { text-align: center; color: #636366; font-size: 13px; padding: 14px; }
  .del-btn { background: none; border: none; color: #636366; font-size: 16px; padding: 0 4px; cursor: pointer; }
  .clear-btn { background: none; border: none; color: #8e8e93; font-size: 11px; cursor: pointer; }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal.open { display: flex; }
  .modal-box { background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 16px; padding: 18px; width: 100%; max-width: 360px; }
  .modal-box h3 { font-size: 16px; margin-bottom: 8px; }
  .modal-box p { font-size: 12px; color: #8e8e93; line-height: 1.4; margin-bottom: 12px; }
  .modal-box a { color: #0a84ff; text-decoration: none; }
  .modal-box input {
    width: 100%; background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff;
    padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; outline: none;
  }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

  <div class="header">
    <div>
      <div class="title">🧠 Gedanken-Cockpit</div>
      <div class="subtitle" id="dateDisplay"></div>
    </div>
    <button id="aiStatusBtn" class="ai-btn" onclick="openModal()">✨ KI</button>
  </div>

  <div class="card">
    <div class="mic-container">
      <button id="micBtn" class="mic-btn" onclick="toggleRecording()">🎙️</button>
      <span id="micStatus" class="mic-status">Tippen zum Sprechen</span>
    </div>

    <textarea id="thoughtInput" rows="3" placeholder="Tippe auf das Mikrofon und sprich einfach drauflos..."></textarea>

    <button id="sortBtn" class="btn-primary" onclick="processThoughts()">✨ Gedanken sortieren</button>
  </div>

  <div class="section-header">
    <span class="section-title">📅 Kalender-Termine</span>
    <span class="badge" id="eventCount">0</span>
  </div>
  <div id="eventsList"></div>

  <div class="section-header">
    <span class="section-title">💼 To-Dos Arbeit</span>
    <button class="clear-btn" onclick="clearDone('work')">Erledigte löschen</button>
  </div>
  <div id="workTodosList"></div>

  <div class="section-header">
    <span class="section-title">🏠 To-Dos Privat</span>
    <button class="clear-btn" onclick="clearDone('private')">Erledigte löschen</button>
  </div>
  <div id="privateTodosList"></div>

  <div id="apiModal" class="modal">
    <div class="modal-box">
      <h3>✨ Google Gemini KI</h3>
      <p>Für KI-Spracherkennung und Stichpunkte kannst du auf <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> kostenlos einen Schlüssel erstellen und hier einfügen:</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
      <div class="modal-actions">
        <button style="background:#0a84ff; color:#fff;" onclick="saveApiKey()">Speichern</button>
        <button style="background:#2c2c2e; color:#fff;" onclick="closeModal()">Schließen</button>
      </div>
    </div>
  </div>

<script>
  let state = { events: [], todos: [] };
  try {
    const saved = localStorage.getItem('cockpit_state_v7');
    if (saved) state = JSON.parse(saved);
  } catch (e) {}

  function saveState() {
    try { localStorage.setItem('cockpit_state_v7', JSON.stringify(state)); } catch (e) {}
    render();
  }

  document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('de-DE', {
    weekday: 'long', day: 'numeric', month: 'long'
  });

  function updateAiBadge() {
    const key = (localStorage.getItem('gemini_api_key') || '').trim();
    const btn = document.getElementById('aiStatusBtn');
    if (key) {
      btn.innerText = '✨ KI aktiv';
      btn.classList.add('active');
    } else {
      btn.innerText = '✨ KI';
      btn.classList.remove('active');
    }
  }
  updateAiBadge();

  function openModal() {
    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    document.getElementById('apiModal').classList.add('open');
  }
  function closeModal() {
    document.getElementById('apiModal').classList.remove('open');
  }
  function saveApiKey() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (val) localStorage.setItem('gemini_api_key', val);
    else localStorage.removeItem('gemini_api_key');
    updateAiBadge();
    closeModal();
  }

  // Liest den Text sauber aus dem Interactions-API-Format aus
  function extractTextFromResponse(data) {
    if (!data) return "";
    if (typeof data.output === "string") return data.output;
    if (Array.isArray(data.outputs)) {
      for (let i = data.outputs.length - 1; i >= 0; i--) {
        const out = data.outputs[i];
        if (typeof out.text === "string") return out.text;
        if (out.content) {
          if (typeof out.content === "string") return out.content;
          if (Array.isArray(out.content.parts)) {
            const txt = out.content.parts.map(function(p) { return p.text || ""; }).join("");
            if (txt) return txt;
          }
        }
      }
    }
    if (data.candidates && data.candidates[0] && data.candidates[0].content && Array.isArray(data.candidates[0].content.parts)) {
      return data.candidates[0].content.parts.map(function(p) { return p.text || ""; }).join("");
    }
    return "";
  }

  // Direkter Aufruf von gemini-3.8-flash über /v1beta/interactions (ohne ungültiges response_format)
  async function callGeminiAPI(apiKey, interactionInput) {
    const controller = new AbortController();
    const timer = setTimeout(function() { controller.abort(); }, 15000);

    try {
      const res = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions?key=' + encodeURIComponent(apiKey), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: "gemini-3.8-flash",
          input: interactionInput
        }),
        signal: controller.signal
      });
      clearTimeout(timer);

      const data = await res.json().catch(function() { return {}; });
      if (res.ok) {
        const textOut = extractTextFromResponse(data);
        if (textOut !== "") return textOut;
        throw new Error("Leere Antwort von Gemini");
      }

      const errMsg = (data.error && data.error.message) ? data.error.message : ("HTTP " + res.status);
      if (res.status === 400 && errMsg.toLowerCase().includes('api key')) {
        throw new Error("API-Key ungültig – bitte unter '✨ KI' prüfen");
      }
      throw new Error(errMsg);
    } catch (err) {
      clearTimeout(timer);
      if (err.name === 'AbortError') {
        throw new Error("Zeitüberschreitung (15s)");
      }
      throw err;
    }
  }

  // Komprimierte Direkt-Aufnahme über MediaRecorder (winzige Dateigröße, keine Hänger)
  let mediaRecorder = null;
  let audioChunks = [];
  let activeStream = null;

  async function toggleRecording() {
    const btn = document.getElementById('micBtn');
    const status = document.getElementById('micStatus');
    const apiKey = (localStorage.getItem('gemini_api_key') || '').trim();

    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      return;
    }

    if (!apiKey) {
      status.innerText = "⚠️ Bitte oben rechts unter '✨ KI' deinen API-Key speichern";
      openModal();
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status.innerText = "⚠️ Mikrofon wird in diesem Browser nicht unterstützt";
      return;
    }

    try {
      activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];

      let options = {};
      if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported) {
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) options = { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 32000 };
        else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4', audioBitsPerSecond: 32000 };
      }

      mediaRecorder = new MediaRecorder(activeStream, options);

      mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstart = function() {
        btn.classList.add('recording');
        status.innerText = "🔴 Aufnahme läuft... (Nochmal tippen zum Beenden)";
      };

      mediaRecorder.onstop = async function() {
        btn.classList.remove('recording');
        if (activeStream) {
          activeStream.getTracks().forEach(function(t) { t.stop(); });
          activeStream = null;
        }

        const mime = (mediaRecorder.mimeType || 'audio/mp4').split(';')[0];
        const blob = new Blob(audioChunks, { type: mime });
        mediaRecorder = null;

        if (blob.size < 150) {
          status.innerText = "Aufnahme zu kurz – bitte nochmal tippen";
          return;
        }

        status.innerText = "⏳ KI transkribiert (" + Math.round(blob.size / 1024) + " KB)...";

        try {
          const base64Audio = await blobToBase64(blob);
          const transcript = await callGeminiAPI(apiKey, [
            { type: "audio", data: base64Audio, mime_type: mime },
            { type: "text", text: "Transkribiere diese deutsche Sprachaufnahme exakt in geschriebenen Text. Gib ausschließlich den gesprochenen Text zurück, ohne Anführungszeichen und ohne Kommentare." }
          ]);

          const cleanText = transcript.trim();
          if (cleanText) {
            const input = document.getElementById('thoughtInput');
            input.value = input.value ? input.value.trim() + " " + cleanText : cleanText;
            status.innerText = "✅ Erkannt – jetzt auf 'Gedanken sortieren' tippen";
          } else {
            status.innerText = "Keine Sprache erkannt – bitte nochmal versuchen";
          }
        } catch (err) {
          status.innerText = "⚠️ " + (err.message || "Fehler bei Spracherkennung");
        }
      };

      mediaRecorder.start(250);
    } catch (err) {
      btn.classList.remove('recording');
      status.innerText = "⚠️ Mikrofon-Zugriff blockiert: In Safari-Einstellungen erlauben";
    }
  }

  function blobToBase64(blob) {
    return new Promise(function(resolve, reject) {
      const reader = new FileReader();
      reader.onloadend = function() {
        const res = reader.result || "";
        resolve(res.split(',')[1] || "");
      };
      reader.onerror = function() { reject(new Error("Audio-Lesefehler")); };
      reader.readAsDataURL(blob);
    });
  }

  async function processThoughts() {
    const input = document.getElementById('thoughtInput');
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById('sortBtn');
    const status = document.getElementById('micStatus');
    btn.innerText = "⏳ KI fasst zusammen...";
    btn.disabled = true;

    const apiKey = (localStorage.getItem('gemini_api_key') || '').trim();

    try {
      if (apiKey) {
        await summarizeWithGemini(text, apiKey);
        status.innerText = "✅ Mit Gemini 3.8 Flash intelligent zusammengefasst";
      } else {
        summarizeLocally(text);
        status.innerText = "Tippen zum Sprechen";
      }
      input.value = '';
      saveState();
    } catch (e) {
      status.innerText = "⚠️ KI-Fehler: " + (e.message || "Unbekannter Fehler");
    } finally {
      btn.innerText = "✨ Gedanken sortieren";
      btn.disabled = false;
    }
  }

  async function summarizeWithGemini(text, apiKey) {
    const todayISO = new Date().toISOString().split('T')[0];
    const weekday = new Date().toLocaleDateString('de-DE', { weekday: 'long' });
    const prompt = "Heute ist " + weekday + ", der " + todayISO + ".\n" +
      "Analysiere diese gesprochene Gedankennotiz: \"" + text + "\".\n" +
      "Extrahiere alle Termine und Aufgaben und fasse jeden Punkt intelligent, klar und extrem prägnant als kurzen Stichpunkt (2 bis 5 Wörter, Infinitiv oder Nomen, KEINE Füllwörter, keine ganzen Sätze) zusammen!\n" +
      "Setze category bei beruflichen Aufgaben auf \"work\", bei privaten Aufgaben auf \"private\".\n" +
      "Antworte AUSSCHLIESSLICH mit einem validen JSON-Objekt ohne Markdown-Codeblock und ohne Erklärung in exakt diesem Format:\n" +
      "{\"events\": [{\"title\": \"Stichpunkt\", \"date\": \"YYYY-MM-DD\", \"time\": \"HH:MM\"}], \"todos\": [{\"title\": \"Stichpunkt\", \"category\": \"work\"}]}";

    const rawResponse = await callGeminiAPI(apiKey, prompt);
    const jsonMatch = rawResponse.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error("Ungültige KI-Antwort");

    const parsed = JSON.parse(jsonMatch[0]);

    (parsed.events || []).forEach(function(ev) {
      state.events.unshift({
        id: Date.now() + Math.random(),
        title: ev.title,
        date: ev.date || todayISO,
        time: ev.time || "09:00"
      });
    });
    (parsed.todos || []).forEach(function(td) {
      state.todos.unshift({
        id: Date.now() + Math.random(),
        title: td.title,
        done: false,
        category: td.category === 'work' ? 'work' : 'private'
      });
    });
  }

  // Lokaler Fallback (nur wenn kein API-Key hinterlegt ist)
  function summarizeLocally(text) {
    const parts = text.split(/\s+(?:und\s+danach|und\s+vorher|außerdem|sowie|und\s+noch|und)\s+|[,.;]+\s*/i);
    parts.forEach(function(part) {
      let clean = part.trim();
      if (!clean) return;
      const isWork = /(arbeit|chef|meeting|kunde|projekt|büro|kollege|rechnung|steuer|präsentation|mail|call)/i.test(clean);
      state.todos.unshift({
        id: Date.now() + Math.random(),
        title: clean.charAt(0).toUpperCase() + clean.slice(1),
        done: false,
        category: isWork ? 'work' : 'private'
      });
    });
  }

  function exportICS(id) {
    const ev = state.events.find(function(e) { return e.id === id; });
    if (!ev) return;
    const partsDate = ev.date.split('-').map(Number);
    const partsTime = ev.time.split(':').map(Number);
    const start = new Date(partsDate[0], partsDate[1] - 1, partsDate[2], partsTime[0], partsTime[1]);
    const end = new Date(start.getTime() + 3600000);

    function fmt(dt) {
      return dt.getFullYear() +
        String(dt.getMonth() + 1).padStart(2, '0') +
        String(dt.getDate()).padStart(2, '0') + 'T' +
        String(dt.getHours()).padStart(2, '0') +
        String(dt.getMinutes()).padStart(2, '0') + '00';
    }

    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//GedankenCockpit//DE',
      'BEGIN:VEVENT',
      'UID:' + Date.now() + '@cockpit',
      'DTSTAMP:' + fmt(new Date()),
      'DTSTART:' + fmt(start),
      'DTEND:' + fmt(end),
      'SUMMARY:' + ev.title,
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');

    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = ev.title.replace(/\s+/g, '_') + '.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  }

  function toggleTodo(id) {
    const t = state.todos.find(function(x) { return x.id === id; });
    if (t) t.done = !t.done;
    saveState();
  }

  function deleteEvent(id) {
    state.events = state.events.filter(function(e) { return e.id !== id; });
    saveState();
  }

  function clearDone(category) {
    state.todos = state.todos.filter(function(t) { return !(t.category === category && t.done); });
    saveState();
  }

  function render() {
    document.getElementById('eventCount').innerText = state.events.length;
    
    const evEl = document.getElementById('eventsList');
    if (state.events.length === 0) {
      evEl.innerHTML = '<div class="item-card empty">Keine Termine vorhanden.</div>';
    } else {
      evEl.innerHTML = state.events.map(function(ev) {
        return '<div class="item-card">' +
          '<div class="event-top">' +
            '<div>' +
              '<div class="event-title">' + ev.title + '</div>' +
              '<div class="event-time">🗓️ ' + ev.date + ' &bull; ⏰ ' + ev.time + ' Uhr</div>' +
            '</div>' +
            '<button class="del-btn" onclick="deleteEvent(' + ev.id + ')">✕</button>' +
          '</div>' +
          '<button class="btn-cal" onclick="exportICS(' + ev.id + ')">📅 In Apple Kalender eintragen</button>' +
        '</div>';
      }).join('');
    }

    const sortedTodos = state.todos.slice().sort(function(a, b) {
      return (a.done === b.done) ? 0 : (a.done ? 1 : -1);
    });

    const workTodos = sortedTodos.filter(function(t) { return t.category === 'work'; });
    const workEl = document.getElementById('workTodosList');
    if (workTodos.length === 0) {
      workEl.innerHTML = '<div class="item-card empty">Keine Aufgaben im Bereich Arbeit.</div>';
    } else {
      workEl.innerHTML = workTodos.map(function(t) {
        return '<div class="item-card todo-row ' + (t.done ? 'done' : '') + '" onclick="toggleTodo(' + t.id + ')">' +
          '<div class="checkbox ' + (t.done ? 'done' : '') + '">' + (t.done ? '✓' : '') + '</div>' +
          '<div class="todo-text ' + (t.done ? 'done' : '') + '">' + t.title + '</div>' +
        '</div>';
      }).join('');
    }

    const privateTodos = sortedTodos.filter(function(t) { return t.category === 'private'; });
    const privEl = document.getElementById('privateTodosList');
    if (privateTodos.length === 0) {
      privEl.innerHTML = '<div class="item-card empty">Keine Aufgaben im Bereich Privat.</div>';
    } else {
      privEl.innerHTML = privateTodos.map(function(t) {
        return '<div class="item-card todo-row ' + (t.done ? 'done' : '') + '" onclick="toggleTodo(' + t.id + ')">' +
          '<div class="checkbox ' + (t.done ? 'done' : '') + '">' + (t.done ? '✓' : '') + '</div>' +
          '<div class="todo-text ' + (t.done ? 'done' : '') + '">' + t.title + '</div>' +
        '</div>';
      }).join('');
    }
  }

  render();
</script>
</body>
</html>
